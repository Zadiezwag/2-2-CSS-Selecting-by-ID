<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: Seasonal ids</title>
        <style>

           
            
         #Olaf {
             color:rgb(255, 255, 255);
            
         }
         #summer {
            color:orange;
         }

         #winter {
            color:rgb(124, 196, 238);
         }

         #snowman {
            color:rgb(253, 253, 253);
         }
         #description {
            color:rgb(255, 254, 254);
         }
        </style>
    </head>
    <body style= "Background-color:rgb(59, 28, 7)">
        
        <h1 id="Olaf">Olaf's favorite seasons</h1>
        
        <h2 id="summer">Summer</h2>
        <p id="snowman">He's a happy snowman, doing what frozen things do in summer.</p>
        
        <h2 id="winter">Winter</h2>
        <p id="description">He likes to stay in and cuddle</p>
    </body>
</html>
